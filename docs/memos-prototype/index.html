<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outline · Memos (native) — UI prototype</title>
<style>
  :root {
    --almost-black: #111319;
    --slate: #66778f;
    --slate-light: #dae1e9;
    --slate-dark: #394351;
    --smoke: #f4f7fa;
    --smoke-dark: #e8ebed;
    --accent: #0366d6;
    --danger: #ed2651;
    --warm-grey: hsl(212 31% 95%);
    --sidebar: hsl(212 31% 95%);
    --radius: 6px;
    --font: -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", Roboto, Oxygen, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--almost-black); font-size: 15px; background: #fff; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  button { font: inherit; }
  .app { display: flex; height: 100vh; }

  /* ---------- Outline sidebar ---------- */
  aside.sb { width: 260px; flex-shrink: 0; background: var(--sidebar); padding: 12px 8px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; }
  .team { display: flex; align-items: center; gap: 8px; padding: 6px 8px 14px; font-weight: 600; position: relative; }
  .team-logo { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .team .bell { margin-left: auto; position: relative; border: 0; background: none; cursor: pointer; color: var(--slate); padding: 3px; border-radius: 4px; display: grid; }
  .team .bell:hover { background: rgba(0,0,0,.06); }
  .team .bell svg { width: 20px; height: 20px; }
  .team .bell .dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--sidebar); }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 4px; color: var(--slate-dark); cursor: pointer; user-select: none; }
  .nav-item:hover { background: rgba(0,0,0,.05); }
  .nav-item.active { background: rgba(0,0,0,.07); color: var(--almost-black); font-weight: 500; }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--slate); }
  .nav-item .count { margin-left: auto; font-size: 12px; color: var(--slate); }
  .nav-item .kb { margin-left: auto; font-size: 11px; color: var(--slate); font-family: var(--mono); }
  .nav-header { font-size: 12px; color: var(--slate); font-weight: 600; padding: 16px 8px 4px; letter-spacing: .02em; }
  .nav-new { margin-left: auto; font-size: 10px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 10px; font-weight: 600; }

  /* ---------- Main ---------- */
  main { flex: 1; overflow-y: auto; position: relative; }
  .titlebar { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 20px; position: sticky; top: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); z-index: 20; font-size: 14px; color: var(--slate); }
  .titlebar b { color: var(--almost-black); font-weight: 500; }
  .titlebar .spacer { flex: 1; }
  h1 { font-size: 30px; font-weight: 600; margin: 4px 0 4px; }
  .muted { color: var(--slate); }
  .small { font-size: 13px; }

  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--slate-light); margin: 10px 0 20px; }
  .tab { padding: 8px 0 10px; font-size: 14px; font-weight: 500; color: var(--slate); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: center; }
  .tab:hover { color: var(--almost-black); }
  .tab.active { color: var(--almost-black); border-color: var(--almost-black); }
  .tab .n { font-size: 12px; color: var(--slate); font-weight: 400; }

  .memos-wrap { display: flex; gap: 40px; max-width: 1060px; margin: 0 auto; padding: 8px 32px 140px; }
  .memos-col { flex: 1; min-width: 0; max-width: 680px; }
  .memos-side { width: 260px; flex-shrink: 0; position: sticky; top: 72px; align-self: flex-start; max-height: calc(100vh - 90px); overflow-y: auto; padding-bottom: 20px; }
  .narrow { max-width: 46em; margin: 0 auto; padding: 24px 32px 120px; }

  /* ---------- Buttons & inputs ---------- */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius); border: 0; background: var(--accent); color: #fff; font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
  .btn.neutral { background: #fff; color: var(--almost-black); box-shadow: inset 0 0 0 1px var(--slate-light); }
  .btn.neutral:hover { background: var(--smoke); filter: none; }
  .btn.danger { background: var(--danger); }
  .btn.ghost { background: transparent; color: var(--slate-dark); box-shadow: none; padding: 0 8px; }
  .btn.ghost:hover { background: rgba(0,0,0,.05); filter: none; }
  .btn.small { height: 26px; padding: 0 8px; font-size: 13px; }
  .btn svg { width: 16px; height: 16px; }
  .icon-btn { border: 0; background: none; cursor: pointer; color: var(--slate); width: 28px; height: 28px; border-radius: 5px; display: inline-grid; place-items: center; position: relative; }
  .icon-btn:hover { background: rgba(0,0,0,.06); color: var(--almost-black); }
  .icon-btn.on { color: var(--accent); background: rgba(3,102,214,.08); }
  .icon-btn svg { width: 18px; height: 18px; }
  .input { width: 100%; height: 34px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--slate-light); font: inherit; font-size: 14px; color: var(--almost-black); background: #fff; outline: none; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(3,102,214,.15); }
  select.input { appearance: auto; }
  .seg { display: inline-flex; border: 1px solid var(--slate-light); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: 0; background: #fff; height: 28px; width: 32px; cursor: pointer; color: var(--slate); display: grid; place-items: center; }
  .seg button + button { border-left: 1px solid var(--slate-light); }
  .seg button.on { background: var(--smoke-dark); color: var(--almost-black); }
  .seg svg { width: 16px; height: 16px; }

  .switch { width: 34px; height: 20px; background: var(--slate-light); border-radius: 12px; position: relative; cursor: pointer; border: 0; padding: 0; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(14px); }

  /* ---------- Composer ---------- */
  .composer { border: 1px solid var(--slate-light); border-radius: 10px; background: #fff; padding: 12px 14px 8px; transition: border-color .15s, box-shadow .15s; position: relative; }
  .composer:focus-within { border-color: #9fc3ef; box-shadow: 0 0 0 3px rgba(3,102,214,.08); }
  .composer textarea { width: 100%; border: 0; outline: none; resize: none; font: inherit; font-size: 15px; line-height: 1.6; min-height: 48px; color: var(--almost-black); background: transparent; }
  .composer textarea::placeholder { color: #9aa7b8; }
  .composer .att-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }
  .att-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--smoke); border: 1px solid var(--slate-light); border-radius: 6px; padding: 3px 8px; color: var(--slate-dark); }
  .att-pill button { border: 0; background: none; cursor: pointer; color: var(--slate); padding: 0; }
  .composer .bar { display: flex; align-items: center; gap: 2px; border-top: 1px solid var(--smoke-dark); padding-top: 8px; margin-top: 4px; }
  .composer .bar .spacer { flex: 1; }
  .composer .hint { font-size: 12px; color: var(--slate); margin-right: 8px; }
  .vis-select { border: 0; background: none; font: inherit; font-size: 13px; color: var(--slate-dark); cursor: pointer; padding: 4px 6px; border-radius: 5px; }
  .vis-select:hover { background: var(--smoke); }
  .suggest { position: absolute; z-index: 40; background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.14); padding: 4px; min-width: 180px; font-size: 14px; }
  .suggest .si { padding: 5px 10px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .suggest .si.sel, .suggest .si:hover { background: var(--warm-grey); }
  .suggest .si .c { color: var(--slate); font-size: 12px; }

  /* ---------- Filter bar ---------- */
  .filterbar { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; flex-wrap: wrap; min-height: 28px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 13px; background: #e6f0fc; color: var(--accent); font-size: 13px; font-weight: 500; }
  .fchip button { border: 0; background: none; cursor: pointer; color: var(--accent); font-size: 15px; line-height: 1; padding: 0 2px; }
  .filterbar .spacer { flex: 1; }

  /* ---------- Memo card ---------- */
  .list.masonry { columns: 2; column-gap: 14px; }
  .list.masonry .memo { break-inside: avoid; }
  .memo { border: 1px solid var(--slate-light); border-radius: 10px; padding: 12px 16px 12px; margin-bottom: 12px; background: #fff; position: relative; transition: border-color .15s, box-shadow .15s; }
  .memo:hover { border-color: #c9d3de; }
  .memo.pinned { border-color: #f3dc9a; background: #fffdf5; }
  .memo.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px rgba(3,102,214,.35); } to { box-shadow: 0 0 0 3px rgba(3,102,214,0); } }
  .memo .mh { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--slate); min-height: 28px; }
  .memo .mh .time { cursor: pointer; }
  .memo .mh .time:hover { color: var(--almost-black); text-decoration: underline; }
  .memo .mh .author { display: flex; align-items: center; gap: 6px; color: var(--almost-black); font-weight: 500; cursor: pointer; }
  .memo .mh .author:hover { text-decoration: underline; }
  .memo .mh .spacer { flex: 1; }
  .memo .mh > * { white-space: nowrap; flex-shrink: 0; }
  .memo .mh .loc { overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; }
  .list.masonry .memo .mh .loc { display: none; }
  .list.masonry .memo .mh .acts { display: none; }
  .memo .mh .author { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .memo .mh .acts { display: flex; gap: 0; opacity: .0; transition: opacity .1s; }
  .memo:hover .mh .acts, .memo .mh .acts.keep { opacity: 1; }
  .memo .mh .pin { color: #c58b00; display: inline-flex; }
  .memo .mh .pin svg { width: 14px; height: 14px; }
  .memo .mh .ccount { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  .memo .mh .ccount svg { width: 15px; height: 15px; }
  .vis-ic { display: inline-flex; }
  .vis-ic svg { width: 14px; height: 14px; }

  .mc { font-size: 15px; line-height: 1.65; word-wrap: break-word; color: var(--almost-black); margin-top: 2px; }
  .mc p { margin: 0 0 6px; }
  .mc p:last-child { margin-bottom: 0; }
  .mc ul { margin: 2px 0 8px; padding-left: 22px; }
  .mc ul.tasks { list-style: none; padding-left: 2px; }
  .mc ul.tasks li { display: flex; gap: 8px; align-items: flex-start; }
  .mc ul.tasks input { margin: 6px 0 0; accent-color: var(--accent); cursor: pointer; }
  .mc ul.tasks li.done span { color: var(--slate); text-decoration: line-through; }
  .mc code { font-family: var(--mono); font-size: 13px; background: var(--smoke); border-radius: 4px; padding: 1px 5px; }
  .mc pre { font-family: var(--mono); font-size: 13px; background: var(--smoke); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 4px 0 8px; line-height: 1.5; }
  .mc blockquote { margin: 4px 0 8px; padding-left: 12px; border-left: 3px solid var(--slate-light); color: var(--slate-dark); }
  .mc h3 { font-size: 16px; margin: 4px 0 4px; }
  .mc .tag { color: var(--accent); cursor: pointer; }
  .mc .tag:hover { text-decoration: underline; }
  .mc .mention-u { background: #e6f0fc; color: var(--accent); border-radius: 4px; padding: 0 4px; font-weight: 500; }
  .mc .doclink { display: inline-flex; align-items: center; gap: 4px; background: var(--smoke); border-radius: 4px; padding: 0 6px 0 4px; font-weight: 500; color: var(--almost-black); }
  .mc .doclink svg { width: 15px; height: 15px; color: var(--slate); }
  .mc.clamped { max-height: 220px; overflow: hidden; position: relative; }
  .mc.clamped::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(rgba(255,255,255,0), #fff); }
  .memo.pinned .mc.clamped::after { background: linear-gradient(rgba(255,253,245,0), #fffdf5); }
  .show-more { font-size: 13px; margin-top: 4px; display: inline-block; }

  .atts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .atts .img { aspect-ratio: 4/3; border-radius: 6px; display: grid; place-items: center; font-size: 12px; color: #fff; font-weight: 500; cursor: zoom-in; position: relative; overflow: hidden; }
  .atts .img span { background: rgba(0,0,0,.35); padding: 2px 6px; border-radius: 4px; }
  .file-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .rels { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .rel { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--slate-dark); background: var(--smoke); border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  .rel:hover { background: var(--smoke-dark); }
  .rel svg { width: 14px; height: 14px; color: var(--slate); flex-shrink: 0; }
  .rel .tx { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  .reactions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .rx { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 13px; border: 1px solid var(--slate-light); background: #fff; font-size: 13px; cursor: pointer; color: var(--slate-dark); }
  .rx:hover { border-color: #b9c6d4; }
  .rx.mine { background: #e6f0fc; border-color: #b5d2f5; color: var(--accent); }

  .memo .edit-wrap { margin-top: 6px; }

  .empty { text-align: center; color: var(--slate); padding: 48px 0; font-size: 14px; }
  .empty .big { font-size: 34px; margin-bottom: 8px; }

  /* ---------- Right panel ---------- */
  .side-sec { margin-bottom: 22px; }
  .side-sec .sh { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--slate); margin-bottom: 8px; letter-spacing: .02em; }
  .side-sec .sh button { border: 0; background: none; color: var(--slate); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 4px; }
  .side-sec .sh button:hover { background: var(--smoke-dark); }
  .search { position: relative; }
  .search svg { position: absolute; left: 9px; top: 9px; width: 16px; height: 16px; color: var(--slate); }
  .search input { padding-left: 32px; background: var(--smoke); border-color: transparent; }
  .search input:focus { background: #fff; }
  .heat { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; }
  .heat .d { width: 12px; height: 12px; border-radius: 3px; background: var(--smoke-dark); cursor: pointer; }
  .heat .d:hover { outline: 1px solid var(--slate); }
  .heat .d.l1 { background: #c6dcf7; } .heat .d.l2 { background: #8bb8ec; } .heat .d.l3 { background: #3f8ae0; } .heat .d.l4 { background: #0353b0; }
  .heat .d.today { outline: 1.5px solid var(--almost-black); }
  .heat .d.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .heat .d.future { background: transparent; cursor: default; }
  .heat-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--slate); margin-top: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--smoke); border-radius: 8px; padding: 8px 10px; }
  .stat .v { font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11.5px; color: var(--slate); }
  .props { display: flex; flex-wrap: wrap; gap: 6px; }
  .prop { font-size: 12.5px; border: 1px solid var(--slate-light); border-radius: 13px; padding: 2px 10px; cursor: pointer; color: var(--slate-dark); background: #fff; }
  .prop:hover { border-color: #b9c6d4; }
  .prop.on { background: #e6f0fc; border-color: #b5d2f5; color: var(--accent); }
  .side-item { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 14px; color: var(--slate-dark); }
  .side-item:hover { background: var(--smoke); }
  .side-item.on { background: #e6f0fc; color: var(--accent); }
  .side-item .c { margin-left: auto; font-size: 12px; color: var(--slate); }
  .side-item .hash { color: var(--slate); width: 12px; text-align: center; }
  .side-item .tw { width: 12px; color: var(--slate); font-size: 10px; text-align: center; }
  .side-item .more { opacity: 0; border: 0; background: none; cursor: pointer; color: var(--slate); padding: 0 2px; }
  .side-item:hover .more { opacity: 1; }

  /* ---------- Detail ---------- */
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--slate); cursor: pointer; margin-bottom: 14px; }
  .back:hover { color: var(--almost-black); }
  .back svg { width: 16px; height: 16px; }
  .section-h { font-size: 14px; font-weight: 600; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-h .n { color: var(--slate); font-weight: 400; }
  .comment { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--smoke-dark); }
  .comment .body { flex: 1; min-width: 0; }
  .comment .who { font-size: 13px; color: var(--slate); margin-bottom: 2px; }
  .comment .who b { color: var(--almost-black); font-weight: 500; }

  /* ---------- Profile ---------- */
  .profile-head { display: flex; align-items: center; gap: 16px; margin: 6px 0 4px; }
  .profile-head .av { width: 64px; height: 64px; font-size: 26px; }

  /* ---------- Attachments ---------- */
  .att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .att-tile { border: 1px solid var(--slate-light); border-radius: 8px; overflow: hidden; font-size: 12.5px; background: #fff; }
  .att-tile .pv { aspect-ratio: 4/3; display: grid; place-items: center; color: #fff; font-size: 22px; }
  .att-tile .nm { padding: 6px 8px 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .att-tile .mt { padding: 0 8px 8px; color: var(--slate); }
  .month { font-size: 13px; font-weight: 600; color: var(--slate); margin: 22px 0 10px; }

  /* ---------- Settings ---------- */
  .row { display: flex; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--slate-light); align-items: center; }
  .row .label { flex: 1; }
  .row .label .t { font-weight: 500; font-size: 14px; }
  .row .label .d { font-size: 13px; color: var(--slate); margin-top: 3px; line-height: 1.45; }
  .row .control { width: 300px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  h2 { font-size: 18px; font-weight: 600; margin: 32px 0 4px; }
  .emoji-chip { font-size: 18px; border: 1px solid var(--slate-light); border-radius: 6px; width: 34px; height: 32px; display: inline-grid; place-items: center; background: #fff; cursor: pointer; position: relative; }
  .emoji-chip:hover::after { content: "×"; position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--slate-dark); color: #fff; font-size: 12px; display: grid; place-items: center; line-height: 1; }

  /* ---------- Menus / popovers ---------- */
  .menu { position: absolute; background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.06); padding: 6px; min-width: 200px; z-index: 60; font-size: 14px; }
  .menu .mi { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 5px; cursor: pointer; color: var(--almost-black); white-space: nowrap; }
  .menu .mi:hover { background: var(--warm-grey); }
  .menu .mi svg { width: 17px; height: 17px; color: var(--slate); }
  .menu .mi .kb { margin-left: auto; font-size: 12px; color: var(--slate); padding-left: 16px; }
  .menu .sep { height: 1px; background: var(--slate-light); margin: 6px 4px; }
  .menu .mi.danger { color: var(--danger); }
  .menu .mi.danger svg { color: var(--danger); }
  .menu .mh2 { font-size: 11px; font-weight: 600; color: var(--slate); padding: 6px 10px 4px; text-transform: uppercase; letter-spacing: .04em; }
  .emoji-pop { display: flex; gap: 2px; padding: 4px; }
  .emoji-pop button { border: 0; background: none; font-size: 20px; width: 34px; height: 34px; border-radius: 6px; cursor: pointer; }
  .emoji-pop button:hover { background: var(--warm-grey); }

  .notif { width: 360px; padding: 0; }
  .notif .nh { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; font-weight: 600; }

    }
    if (l.startsWith('> ')) { html += `<blockquote>${inline(l.slice(2))}</blockquote>`; i++; continue; }
    if (l.startsWith('### ')) { html += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
    if (l.trim() === '') { i++; continue; }
    html += `<p>${inline(l)}</p>`; i++;
  }
  return html;
}
function toggleTask(id, idx) {
  const m = byId(id);
  let n = -1;
  m.text = m.text.split('\n').map((l) => {
    if (/^- \[( |x)\] /.test(l) && ++n === idx) return l[3] === 'x' ? '- [ ]' + l.slice(5) : '- [x]' + l.slice(5);
    return l;
  }).join('\n');
}

}
function closeOverlay() { $('#overlay').innerHTML = ''; }
function closeFloat() { $('#float').innerHTML = ''; }
function floatAt(html, anchor, align = 'left') {
  const r = anchor.getBoundingClientRect();
  $('#float').innerHTML = html;
  const m = $('#float').firstElementChild;
  m.style.position = 'fixed';
  m.style.top = (r.bottom + 4) + 'px';
  const w = m.offsetWidth;
  let left = align === 'right' ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  m.style.left = left + 'px';
  if (r.bottom + 4 + m.offsetHeight > window.innerHeight - 8) m.style.top = Math.max(8, r.top - m.offsetHeight - 4) + 'px';
}

/* ---------------- Filtering ---------------- */
function activeFilter() {
  const f = { ...S.filters };
  if (f.shortcut) Object.assign(f, S.shortcuts.find((s) => s.id === f.shortcut)?.filter || {});
  return f;
}
function applyFilters(list) {
  const f = activeFilter();
  return list.filter((m) => {
    if (f.tag && !tagsOf(m.text).some((t) => t === f.tag || t.startsWith(f.tag + '/'))) return false;
    if (f.query && !m.text.toLowerCase().includes(f.query.toLowerCase())) return false;
    if (f.date && dayKey(m.created) !== f.date) return false;
    if (f.prop && !props(m)[f.prop]) return false;
    return true;
  });
}
function sortMemos(list) {
  return list.sort((a, b) => (b.pinned - a.pinned) || (b.created - a.created));
}
function scopeList() {
  const top = memos.filter((m) => !m.parentId);
  if (S.view === 'home') return top.filter((m) => m.creator === ME && !m.archived);
  if (S.view === 'explore') return top.filter((m) => m.vis !== 'PRIVATE' && !m.archived);
  if (S.view === 'archived') return top.filter((m) => m.creator === ME && m.archived);
  if (S.view === 'profile') return top.filter((m) => m.creator === S.profileId && !m.archived && (m.vis !== 'PRIVATE' || m.creator === ME));
  return [];
}

function snippet(m, n = 60) {
  if (!m) return '';
  const t = m.text.replace(/```[\s\S]*?```/g, '').replace(/[#>*`\[\]-]/g, ' ').replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n) + '…' : t;
}

/* ---------------- Right panel ---------------- */
function heatmapHtml(list) {
  const counts = {};
  list.forEach((m) => { const k = dayKey(m.created); counts[k] = (counts[k] || 0) + 1; });

  // add deterministic history so the calendar looks lived-in
  for (let d = 7; d < 120; d++) {
    const x = Math.sin(d * 12.9898) * 43758.5453;
    const r = x - Math.floor(x);
    if (r > 0.45) { const k = dayKey(new Date(NOW - d * DAY)); counts[k] = (counts[k] || 0) + Math.ceil((r - 0.45) * 8); }
  }
  const weeks = 17;
  const end = new Date(NOW); end.setHours(12);
  const start = new Date(end - ((weeks - 1) * 7 + end.getDay()) * DAY);
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(+start + i * DAY);
    const k = dayKey(d);
    if (d > end) { cells += '<div class="d future"></div>'; continue; }
    const c = counts[k] || 0;
    const lv = c === 0 ? '' : c === 1 ? 'l1' : c <= 2 ? 'l2' : c <= 4 ? 'l3' : 'l4';
    cells += `<div class="d ${lv} ${k === dayKey(NOW) ? 'today' : ''} ${S.filters.date === k ? 'sel' : ''}" data-act="day" data-d="${k}" title="${c} memo${c === 1 ? '' : 's'} on ${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}"></div>`;
  }
  return `<div class="heat">${cells}</div><div class="heat-legend"><span>${start.toLocaleDateString('en-US', { month: 'short' })}</span><span>Less <span class="d" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--smoke-dark)"></span> <span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#8bb8ec"></span> <span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#0353b0"></span> More</span><span>Oct</span></div>`;
}

function tagTree(list) {
  const counts = {};
  list.forEach((m) => tagsOf(m.text).forEach((t) => {
    const parts = t.split('/');
    parts.forEach((_, i) => { const k = parts.slice(0, i + 1).join('/'); counts[k] = (counts[k] || 0) + 1; });
  }));
  const keys = Object.keys(counts).sort();
  const isChildHidden = (k) => k.split('/').slice(0, -1).some((_, i, arr) => S.collapsedTags[k.split('/').slice(0, i + 1).join('/')]);
  return keys.filter((k) => !isChildHidden(k)).map((k) => {
    const depth = k.split('/').length - 1;
    const hasKids = keys.some((x) => x.startsWith(k + '/'));
    return `<div class="side-item ${S.filters.tag === k ? 'on' : ''}" data-act="tag" data-tag="${k}" style="padding-left:${6 + depth * 14}px">
      ${hasKids ? `<span class="tw" data-act="tag-toggle" data-tag="${k}">${S.collapsedTags[k] ? '▸' : '▾'}</span>` : '<span class="hash">#</span>'}
      ${esc(k.split('/').pop())}<span class="c">${counts[k]}</span>
      <button class="more" data-act="tag-menu" data-tag="${k}" title="Tag options">${I.more.replace('<svg', '<svg width="14" height="14"')}</button></div>`;
  }).join('') || '<div class="small muted">No tags yet. Type # in a memo.</div>';
}

/* ---------------- Render ---------------- */
function render() {
  renderSidebar();
  const main = $('#main');
  const top = main.scrollTop;
  const focusedId = document.activeElement?.dataset?.input;
  const caret = document.activeElement?.selectionStart;
  const scenes = { home: sceneList, explore: sceneList, archived: sceneList, attachments: sceneAttachments, detail: sceneDetail, profile: sceneProfile, settings: sceneSettings, doc: sceneDoc };
  main.innerHTML = scenes[S.view]();
  main.scrollTop = top;
  if (focusedId) {
    const ta = $(`[data-input="${CSS.escape(focusedId)}"]`);
    if (ta) { ta.focus(); try { ta.setSelectionRange(caret, caret); } catch {} }
  }
  const auto = $('textarea[autofocus]');
  if (auto && !focusedId) { auto.focus(); auto.setSelectionRange(auto.value.length, auto.value.length); }
  document.querySelectorAll('textarea[data-input]').forEach(autosize);
  renderProto();
}
function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 420) + 'px'; }

function go(view, extra = {}) {
  if (S.view !== view || extra.detailId || extra.profileId) S.prev = { view: S.view, detailId: S.detailId, profileId: S.profileId };
  Object.assign(S, { view, editingId: null }, extra);
  closeFloat(); closeOverlay();
  $('#main').scrollTop = 0;
  render();
}

/* ---------------- Prototype panel ---------------- */

/* ---------------- Composer logic ---------------- */
const drafts = {};
function composerState(c) {
  if (c === 'new') return { atts: S.composerAtts, rels: S.composerRels };
  if (c.startsWith('comment:')) return { atts: [], rels: [] };
  if (c === 'quick') return S.quick;
  const m = byId(c);
  return { atts: m.attachments, rels: m.relations };
}
function saveComposer(c) {
  const ta = $(`[data-input="${CSS.escape(c)}"]`);
  const text = ta.value.trim();
  if (!text) return;
  if (text.length > S.settings.maxLen) { toast(`Memo is longer than ${S.settings.maxLen} characters`); return; }
  const visSel = $(`select[data-c="${CSS.escape(c)}"]`);
  const vis = visSel ? visSel.value : 'TEAM';
  if (c === 'new' || c === 'quick') {
    const st = c === 'new' ? { atts: S.composerAtts, rels: S.composerRels } : S.quick;
    const m = M({ creator: ME, vis, created: new Date(NOW), text, attachments: [...st.atts], relations: [...st.rels] });
    memos.unshift(m);
    S.composerAtts = []; S.composerRels = [];
    if (c === 'quick') { closeOverlay(); toast(`${I.check} Memo saved · <a data-act="open" data-id="${m.id}">Open</a>`); if (['home'].includes(S.view)) render(); else renderSidebar(); return; }
    ta.value = '';
    render();
    flash(m.id);
    return;
  }
  if (c.startsWith('comment:')) {
    const pid = c.slice(8);
    memos.push(M({ creator: ME, vis: byId(pid).vis, parentId: pid, created: new Date(NOW), text }));
    render();
    toast(`${I.check} Comment added`);
    return;
  }
  const m = byId(c);
  m.text = text; m.vis = vis;
  S.editingId = null;
  render();
  flash(m.id);
  toast(`${I.check} Memo updated`);
}
function flash(id) {
  const el = $(`[data-memo="${id}"]`);
  if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300); }
}
function insertAt(c, v) {
  const ta = $(`[data-input="${CSS.escape(c)}"]`);
  if (!ta) return;
  const s = ta.selectionStart ?? ta.value.length;
  const pre = ta.value.slice(0, s), post = ta.value.slice(ta.selectionEnd ?? s);
  const needNl = v.startsWith('- [ ]') || v.startsWith('```');
  const ins = (needNl && pre && !pre.endsWith('\n') ? '\n' : '') + v;
  ta.value = pre + ins + post;
  const pos = pre.length + (v.startsWith('```') ? ins.length - 4 : ins.length);
  ta.focus(); ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

/* tag autocomplete */
let sugg = null;
function allTags() {
  const c = {};
  memos.filter((m) => m.creator === ME).forEach((m) => tagsOf(m.text).forEach((t) => { c[t] = (c[t] || 0) + 1; }));
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
}
function updateSuggest(ta) {
  const before = ta.value.slice(0, ta.selectionStart);
  const mt = before.match(/(^|\s)#([\p{L}\p{N}_\-/]*)$/u);
  const md = before.match(/\[\[([^\]]*)$/);
  closeSuggest();
  let items = [];
  if (mt) {
    items = allTags().filter(([t]) => t.startsWith(mt[2].toLowerCase()) && t !== mt[2].toLowerCase()).slice(0, 6).map(([t, n]) => ({ label: '#' + t, meta: n, insert: t + ' ', del: mt[2].length }));
  } else if (md) {
    items = ['Team rituals', 'Onboarding guide', 'API reference', 'Release checklist'].filter((d) => d.toLowerCase().includes(md[1].toLowerCase())).map((d) => ({ label: '📄 ' + d, meta: 'Document', insert: d + ']] ', del: md[1].length }));
  }
  if (!items.length) return;
  sugg = { ta, items, sel: 0 };
  const r = ta.getBoundingClientRect();
  const box = document.createElement('div');
  box.className = 'suggest'; box.id = 'suggest';
  box.style.position = 'fixed';
  box.style.left = (r.left + 4) + 'px';
  box.style.top = (r.bottom + 2) + 'px';
  box.innerHTML = items.map((it, i) => `<div class="si ${i === 0 ? 'sel' : ''}" data-act="sugg" data-i="${i}"><span>${esc(it.label)}</span><span class="c">${it.meta}</span></div>`).join('');
  document.body.appendChild(box);
}
function closeSuggest() { $('#suggest')?.remove(); sugg = null; }
function applySuggest(i) {
  const { ta, items } = sugg;
  const it = items[i];
  const s = ta.selectionStart;
  ta.value = ta.value.slice(0, s - it.del) + it.insert + ta.value.slice(s);
  const p = s - it.del + it.insert.length;
  ta.focus(); ta.setSelectionRange(p, p);
  closeSuggest();
  syncSaveBtn(ta);
}
function syncSaveBtn(ta) {
  const c = ta.dataset.input;
  const b = $(`[data-act="save"][data-c="${CSS.escape(c)}"]`);
  if (b) b.disabled = !ta.value.trim();
}

/* ---------------- Quick capture ---------------- */
function openQuick(prefillRel) {
  S.quick = { atts: [], rels: prefillRel ? [prefillRel] : [] };
  modal(`<div class="mhd"><span style="display:flex;gap:8px;align-items:center">${I.memo.replace('<svg', '<svg width="20" height="20"')} New memo</span><button class="x" data-act="close">×</button></div>
    <div class="mb" style="padding-bottom:16px">${composerHtml({ id: 'quick', vis: S.defaultVis, atts: [], rels: S.quick.rels, autofocus: true })}
    <div class="small muted" style="margin-top:8px">Saved to your memos. Press <b>⌘⇧M</b> anywhere in Outline to capture a thought.</div></div>`);
  setTimeout(() => { const t = $('[data-input="quick"]'); t?.focus(); }, 30);
}

/* ---------------- Events ---------------- */
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.input) { autosize(t); syncSaveBtn(t); updateSuggest(t); }
  if (t.id === 'q') {
    S.filters.query = t.value;
    clearTimeout(window._qt);
    window._qt = setTimeout(() => { render(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 200);
  }
});

document.addEventListener('keydown', (e) => {
  if (sugg) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sugg.sel = (sugg.sel + (e.key === 'ArrowDown' ? 1 : sugg.items.length - 1)) % sugg.items.length;
      document.querySelectorAll('#suggest .si').forEach((el, i) => el.classList.toggle('sel', i === sugg.sel));
      return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); applySuggest(sugg.sel); return; }
    if (e.key === 'Escape') { closeSuggest(); return; }
  }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 'm' || e.key === 'M')) { e.preventDefault(); openQuick(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.dataset?.input) { e.preventDefault(); saveComposer(e.target.dataset.input); return; }
  if (e.key === 'Escape') {
    if ($('#overlay').innerHTML) { closeOverlay(); return; }
    if ($('#float').innerHTML) { closeFloat(); return; }
    if (S.editingId) { S.editingId = null; render(); }
  }
});

document.addEventListener('change', (e) => {
  const a = e.target.dataset.act;
  if (a === 'vis' && e.target.dataset.c === 'new') S.composerVis = e.target.value;
  if (a === 'defvis') { S.defaultVis = e.target.value; S.composerVis = e.target.value; toast(`${I.check} Saved`); }
  if (a === 'showupdated') { S.settings.showUpdated = e.target.selectedIndex === 1; toast(`${I.check} Saved`); }
  if (a === 'maxlen') { S.settings.maxLen = parseInt(e.target.value, 10) || 8192; toast(`${I.check} Saved`); }
  if (a === 'task') { toggleTask(e.target.dataset.id, +e.target.dataset.i); render(); }
});

document.addEventListener('click', (e) => {
  const pr = e.target.closest('[data-proto]');
  if (pr) {
    const k = pr.dataset.proto;
    if (k === 'detail') return go('detail', { detailId: 'm1' });
    if (k === 'profile') return go('profile', { profileId: 'u2' });
    return go(k);
  }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); if (g.dataset.go === 'settings') return go('settings'); return go(g.dataset.go); }

  const tagEl = e.target.closest('.mc .tag');
  if (tagEl) { S.filters.tag = tagEl.dataset.tag.toLowerCase(); S.filters.shortcut = null; if (!['home', 'explore', 'archived', 'profile'].includes(S.view)) S.view = 'home'; closeFloat(); render(); return; }

  const el = e.target.closest('[data-act]');
  if (!e.target.closest('#float') && !(el && ['memo-menu', 'react-pick', 'notif', 'tag-menu'].includes(el.dataset.act))) closeFloat();
  if (!e.target.closest('#suggest') && !e.target.dataset?.input) closeSuggest();
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();

  switch (act) {
    case 'backdrop': if (e.target === el) closeOverlay(); break;
    case 'close': closeOverlay(); break;
    case 'noop': break;
    case 'proto-toggle': $('#proto').classList.toggle('collapsed'); renderProto(); break;

    /* composer */
    case 'save': saveComposer(el.dataset.c); break;
    case 'ins': insertAt(el.dataset.c, el.dataset.v.replace(/\\n/g, '\n')); break;
    case 'attach': {
      const st = composerState(el.dataset.c);
      const names = [['photo.jpg', 'img', '#f0a35e'], ['notes.pdf', 'file'], ['sketch.png', 'img', '#5bb8a6']];
      const [name, type, color] = names[st.atts.length % names.length];
      st.atts.push({ name, type, color });
      keepTextRender(el.dataset.c);
      break;
    }
    case 'rm-att': composerState(el.dataset.c).atts.splice(+el.dataset.i, 1); keepTextRender(el.dataset.c); break;
    case 'rm-rel': composerState(el.dataset.c).rels.splice(+el.dataset.i, 1); keepTextRender(el.dataset.c); break;
    case 'location': insertAt(el.dataset.c, ''); toast('📍 Location added: Market St, San Francisco'); break;
    case 'link-memo': {
      const c = el.dataset.c;
      const opts = memos.filter((m) => !m.parentId && (m.creator === ME || m.vis !== 'PRIVATE') && m.id !== c);
      const html = `<div class="mhd">Link a memo<button class="x" data-act="close">×</button></div>
        <div class="mb"><input class="input" placeholder="Search memos…" id="rel-q"/>
        <div class="pick-list" id="rel-list">${opts.map((m) => `<div class="pick" data-act="pick-rel" data-c="${c}" data-id="${m.id}">${avatar(m.creator, 's18')}<span class="tx">${esc(snippet(m, 70))}</span><span class="tm">${rel(m.created)}</span></div>`).join('')}</div></div>
        <div class="mf"><button class="btn neutral" data-act="close">Cancel</button></div>`;
      if (c === 'quick') { S._quickText = $('[data-input="quick"]').value; }
      S._relBack = c;
      S._relText = $(`[data-input="${CSS.escape(c)}"]`)?.value;
      modal(html);
      $('#rel-q').addEventListener('input', (ev) => {
        const q = ev.target.value.toLowerCase();
        document.querySelectorAll('#rel-list .pick').forEach((p) => { p.style.display = p.textContent.toLowerCase().includes(q) ? '' : 'none'; });
      });
      break;
    }
    case 'pick-rel': {
      const c = el.dataset.c;
      const st = composerState(c);
      if (!st.rels.includes(id)) st.rels.push(id);
      if (c === 'quick') { openQuick(); S.quick = st; const t = $('[data-input="quick"]'); t.value = S._quickText || ''; refreshQuick(); }
      else { closeOverlay(); const t = S._relText; render(); const ta = $(`[data-input="${CSS.escape(c)}"]`); if (ta) { ta.value = t || ''; syncSaveBtn(ta); } }
      break;
    }
    case 'sugg': applySuggest(+el.dataset.i); break;
    case 'cancel-edit': S.editingId = null; render(); break;

    /* memo actions */
    case 'memo-menu': floatAt(memoMenu(byId(id)), el, 'right'); break;
    case 'edit': closeFloat(); S.editingId = id; render(); break;
    case 'expand': S.expanded[id] = true; render(); break;
    case 'open': closeFloat(); closeOverlay(); go('detail', { detailId: id }); break;
    case 'back': { const p = S.prev || { view: 'home' }; go(p.view === 'detail' || p.view === S.view ? 'home' : p.view, { detailId: p.detailId, profileId: p.profileId }); break; }
    case 'profile': go('profile', { profileId: el.dataset.u }); break;
    case 'pin': { const m = byId(id); m.pinned = !m.pinned; closeFloat(); render(); toast(m.pinned ? '📌 Pinned to the top' : 'Unpinned'); break; }
    case 'copy-link': closeFloat(); navigator.clipboard?.writeText(`https://wiki.acme.com/memo/${id}`); toast(`${I.check} Link copied`); break;
    case 'archive': { const m = byId(id); m.archived = true; closeFloat(); if (S.view === 'detail') go('home'); else render(); toast(`Memo archived · <a data-act="restore" data-id="${id}">Undo</a>`); break; }
    case 'restore': { const m = byId(id); m.archived = false; closeFloat(); render(); toast(`${I.check} Memo restored`); break; }
    case 'delete':
      closeFloat();
      modal(`<div class="mhd">Delete memo?<button class="x" data-act="close">×</button></div>
        <div class="mb">“${esc(snippet(byId(id), 80))}”<br/><br/>It moves to Trash with its ${comments(id).length} comment(s) and can be restored for 30 days.</div>
        <div class="mf"><button class="btn neutral" data-act="close">Cancel</button><button class="btn danger" data-act="confirm-delete" data-id="${id}">Delete</button></div>`);
      break;
    case 'confirm-delete': memos = memos.filter((m) => m.id !== id && m.parentId !== id); closeOverlay(); if (S.view === 'detail') go('home'); else render(); toast('Memo moved to Trash'); break;
    case 'share-public': {
      closeFloat();
      const m = byId(id);
      if (m.vis === 'PUBLIC') { toast(`${I.check} Public link copied`); break; }
      modal(`<div class="mhd">Share memo publicly<button class="x" data-act="close">×</button></div>
        <div class="mb">Anyone with the link can read this memo, without signing in. Comments stay private to the workspace.
        <div style="display:flex;gap:6px;margin-top:12px"><input class="input" readonly value="https://wiki.acme.com/s/memo-${id}"/><button class="btn" data-act="publish" data-id="${id}">Publish</button></div></div>
        <div class="mf"><button class="btn neutral" data-act="close">Cancel</button></div>`);
      break;
    }
    case 'publish': byId(id).vis = 'PUBLIC'; closeOverlay(); render(); toast(`${I.check} Published · link copied`); break;
    case 'quote-new': closeFloat(); openQuick(id); break;
    case 'convert': {
      closeFloat();
      const m = byId(id);
      modal(`<div class="mhd">Convert to document<button class="x" data-act="close">×</button></div>
        <div class="mb">Creates a document from this memo’s content, attachments and tags. The memo stays, with a link to the new document.
          <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
            <label class="small"><b>Title</b><input class="input" id="cv-title" style="margin-top:4px" value="${esc(snippet(m, 50).replace(/…$/, ''))}"/></label>
            <label class="small"><b>Collection</b><select class="input" id="cv-col" style="margin-top:4px"><option>Team rituals</option><option>Engineering</option><option>Product</option></select></label>
            <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" checked id="cv-arch"/> Archive the memo afterwards</label>
          </div></div>
        <div class="mf"><button class="btn neutral" data-act="close">Cancel</button><button class="btn" data-act="do-convert" data-id="${id}">Create document</button></div>`);
      break;
    }
    case 'do-convert': {
      const m = byId(id);
      S.convertedDoc = { title: $('#cv-title').value || 'Untitled', collection: $('#cv-col').value, text: m.text, memoId: id };
      if ($('#cv-arch').checked) m.archived = true;
      closeOverlay();
      go('doc');
      toast(`${I.check} Document created in ${esc(S.convertedDoc.collection)}`);
      break;
    }

    /* reactions */
    case 'react-pick': {
      floatAt(`<div class="menu emoji-pop">${S.settings.reactions.map((e2) => `<button data-act="react" data-id="${id}" data-e="${e2}">${e2}</button>`).join('')}</div>`, el, 'right');
      break;
    }
    case 'react': {
      const m = byId(id);
      const e2 = el.dataset.e;
      const us = m.reactions[e2] || (m.reactions[e2] = []);
      const i = us.indexOf(ME);
      if (i >= 0) us.splice(i, 1); else us.push(ME);
      if (!us.length) delete m.reactions[e2];
      closeFloat(); render();
      break;
    }
    case 'lightbox': modal(`<div class="lightbox" data-act="close">${esc(el.dataset.n)} · click to close</div>`, 720); break;

    /* filters */
    case 'tag': if (e.target.closest('[data-act="tag-toggle"],[data-act="tag-menu"]')) break; S.filters.tag = S.filters.tag === el.dataset.tag ? null : el.dataset.tag; S.filters.shortcut = null; render(); break;
    case 'tag-toggle': S.collapsedTags[el.dataset.tag] = !S.collapsedTags[el.dataset.tag]; render(); break;
    case 'tag-menu': {
      const t = el.dataset.tag;
      floatAt(`<div class="menu"><div class="mh2">#${esc(t)}</div>
        <div class="mi" data-act="tag-rename" data-tag="${esc(t)}">${I.edit} Rename tag…</div>
        <div class="mi" data-act="tag-shortcut" data-tag="${esc(t)}">⚡ Save as shortcut</div>
        <div class="sep"></div>
        <div class="mi danger" data-act="tag-delete" data-tag="${esc(t)}">${I.trash} Remove tag from memos</div></div>`, el, 'right');
      break;
    }
    case 'tag-rename': {
      closeFloat();
      const t = el.dataset.tag;
      const n = prompt(`Rename #${t} in all of your memos to:`, t);
      if (n && n !== t) {
        const re = new RegExp(`(^|\\s)#${t.replace(/[/-]/g, '\\$&')}(?=[\\s/]|$)`, 'gi');
        memos.forEach((m) => { if (m.creator === ME) m.text = m.text.replace(re, `$1#${n}`); });
        if (S.filters.tag === t) S.filters.tag = n;
        render(); toast(`${I.check} Renamed #${esc(t)} to #${esc(n)}`);
      }
      break;
    }
    case 'tag-delete': {
      closeFloat();
      const t = el.dataset.tag;
      const re = new RegExp(`(^|\\s)#${t.replace(/[/-]/g, '\\$&')}(?=\\s|$)`, 'gi');
      memos.forEach((m) => { if (m.creator === ME) m.text = m.text.replace(re, '$1').trim(); });
      if (S.filters.tag === t) S.filters.tag = null;
      render(); toast(`Removed #${esc(t)} from your memos`);
      break;
    }
    case 'tag-shortcut': closeFloat(); S.shortcuts.push({ id: 's' + Date.now(), title: '#' + el.dataset.tag, filter: { tag: el.dataset.tag } }); render(); toast(`${I.check} Shortcut saved`); break;
    case 'day': S.filters.date = S.filters.date === el.dataset.d ? null : el.dataset.d; render(); break;
    case 'prop': S.filters.prop = S.filters.prop === el.dataset.p ? null : el.dataset.p; render(); break;
    case 'shortcut': S.filters = { tag: null, query: '', date: null, prop: null, shortcut: S.filters.shortcut === el.dataset.s ? null : el.dataset.s }; render(); break;
    case 'clear-f': S.filters[el.dataset.k] = el.dataset.k === 'query' ? '' : null; render(); break;
    case 'clear-all': S.filters = { tag: null, query: '', date: null, prop: null, shortcut: null }; render(); break;
    case 'new-shortcut': {
      const f = S.filters;
      const desc = [f.tag && '#' + f.tag, f.prop, f.query && `“${f.query}”`].filter(Boolean).join(' + ');
      modal(`<div class="mhd">New shortcut<button class="x" data-act="close">×</button></div>
        <div class="mb">Saves a filter you can open with one click.
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
          <label class="small"><b>Name</b><input class="input" id="sc-name" style="margin-top:4px" value="${esc(desc || 'My shortcut')}"/></label>
          <label class="small"><b>Filter</b><input class="input" id="sc-filter" style="margin-top:4px;font-family:var(--mono);font-size:13px" value="${esc(desc ? `tag:${f.tag || ''} ${f.prop ? 'has:' + f.prop : ''} ${f.query || ''}`.trim() : 'tag:work has:tasks')}"/></label>
          <div class="small muted">Syntax: <code>tag:work</code> <code>has:tasks</code> <code>has:link</code> <code>has:code</code> <code>visibility:workspace</code> plus free text.</div>
        </div></div>
        <div class="mf"><button class="btn neutral" data-act="close">Cancel</button><button class="btn" data-act="save-shortcut">Save</button></div>`);
      break;
    }
    case 'save-shortcut': {
      const raw = $('#sc-filter').value;
      const filter = {};
      const tm = raw.match(/tag:([\w/-]+)/); if (tm) filter.tag = tm[1];
      const hm = raw.match(/has:(\w+)/); if (hm) filter.prop = hm[1];
      const q = raw.replace(/\w+:[\w/-]+/g, '').trim(); if (q) filter.query = q;
      S.shortcuts.push({ id: 's' + Date.now(), title: $('#sc-name').value || 'Shortcut', filter });
      closeOverlay(); render(); toast(`${I.check} Shortcut saved`);
      break;
    }
    case 'layout': S.layout = el.dataset.l; render(); break;

    /* misc */
    case 'quick': openQuick(); break;
    case 'notif': {
      S.unread = 0; renderSidebar();
      const anchor = $('.bell');
      floatAt(`<div class="menu notif">
        <div class="nh">Notifications <a class="small" style="font-weight:400">Mark all read</a></div>
        <div class="ni unread" data-act="open" data-id="m3">${avatar('u3', 's28')}<div><b>Priya Nair</b> commented on your memo<div class="q">“I can reproduce this. Looks like the PDF font fallback.”</div><div class="t">2 hours ago</div></div></div>
        <div class="ni unread" data-act="open" data-id="m4">${avatar('u2', 's28')}<div><b>Sam Rivera</b> mentioned you in a memo<div class="q">“Coffee chat with @alice: API docs needed by Friday…”</div><div class="t">3 hours ago</div></div></div>
        <div class="ni" data-act="open" data-id="m1">${avatar('u3', 's28')}<div><b>Priya Nair</b> reacted 👍 to your memo<div class="q">Weekly review template</div><div class="t">yesterday</div></div></div>
        <div class="ni">${avatar('u2', 's28')}<div><b>Sam Rivera</b> updated the document <b>API reference</b><div class="t">2 days ago</div></div></div>
      </div>`, anchor);
      break;
    }
    case 'open-doc': toast('Opens the linked Outline document'); break;
    case 'clean-unused': toast('Deleted 2 unused attachments'); break;

    /* settings */
    case 'set-enabled': S.settings.enabled = !S.settings.enabled; render(); toast(S.settings.enabled ? 'Memos enabled for the workspace' : 'Memos hidden for all members'); break;
    case 'set-public': S.settings.allowPublic = !S.settings.allowPublic; render(); break;
    case 'set-comments': S.settings.comments = !S.settings.comments; render(); break;
    case 'rm-emoji': S.settings.reactions = S.settings.reactions.filter((x) => x !== el.dataset.e); render(); break;
    case 'add-emoji': { const em = prompt('Emoji to add:', '🔥'); if (em) { S.settings.reactions.push(em.trim()); render(); } break; }
    case 'import':
      modal(`<div class="mhd">Import from Memos<button class="x" data-act="close">×</button></div>
        <div class="mb">Connect to an existing Memos server once and copy everything into this workspace. Memos are created for users with a matching email; others are assigned to you.
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
          <label class="small"><b>Server URL</b><input class="input" style="margin-top:4px" value="https://memos.example.com"/></label>
          <label class="small"><b>Admin access token</b><input class="input" style="margin-top:4px" type="password" value="memos_pat_xxxxx"/></label>
          <div class="small muted">Or upload a Memos backup (<code>memos_prod.db</code>) instead.</div>
        </div></div>
        <div class="mf"><button class="btn neutral" data-act="close">Cancel</button><button class="btn" data-act="start-import">Start import</button></div>`);
      break;
    case 'start-import': closeOverlay(); toast('Import started · follow progress in Settings → Import', 3500); setTimeout(() => toast(`${I.check} Imported 1,284 memos, 312 comments, 96 attachments`), 2600); break;
    case 'export': toast('Preparing export · we’ll email you a download link'); break;
  }
});

function keepTextRender(c) {
  const ta = $(`[data-input="${CSS.escape(c)}"]`);
  const v = ta?.value;
  if (c === 'quick') { refreshQuick(v); return; }
  render();
  const t2 = $(`[data-input="${CSS.escape(c)}"]`);
  if (t2 && v != null) { t2.value = v; syncSaveBtn(t2); autosize(t2); }
}
function refreshQuick(v) {
  const t = $('[data-input="quick"]');
  const text = v != null ? v : t?.value || '';
  const holder = $('[data-composer="quick"]');
  if (!holder) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = composerHtml({ id: 'quick', text, vis: S.defaultVis, atts: S.quick.atts, rels: S.quick.rels });
  holder.replaceWith(wrap.firstElementChild);
  const nt = $('[data-input="quick"]');
  nt.focus(); autosize(nt);
}

// Deep links, e.g. #explore, #detail=m1, #profile=u2, #settings
(function applyHash() {
  const [k, v] = location.hash.slice(1).split('&')[0].split('=');
  if (k === 'detail') { S.view = 'detail'; S.detailId = v || 'm1'; }
  else if (k === 'profile') { S.view = 'profile'; S.profileId = v || 'u2'; }
  else if (['home', 'explore', 'archived', 'attachments', 'settings'].includes(k)) S.view = k;
  if (location.hash.includes('masonry')) S.layout = 'masonry';
})();
render();
if (location.hash.includes('notif')) setTimeout(() => $('.bell')?.click(), 50);
if (location.hash.includes('menu')) setTimeout(() => $('[data-act="memo-menu"]')?.click(), 50);
if (location.hash.includes('quick')) setTimeout(() => openQuick(), 50);
</script>
</body>
</html>
